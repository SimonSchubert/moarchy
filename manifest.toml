# manifest.toml -- the version pins.
#
# This is the only file in this project that says what version of anything is
# built. Nothing here clones at HEAD (docs/structure.md V2): every input this
# project does not itself version names its upstream and an exact commit, so
# two builds of the same manifest install the same bytes.
#
# Read it from bash with scripts/manifest.sh:
#
#   . scripts/manifest.sh
#   ref=$(manifest_get omarchy ref) || exit 1
#
# A missing or empty pin is a hard error there, never an empty string -- an
# unread pin that degrades to "" is a clone at HEAD wearing a disguise, which
# is the exact failure these pins exist to prevent.
#
# To move a pin: change it here, rebuild, and nothing else. Bumping a pin is
# the only supported way to change what an image contains (V5).

# ---------------------------------------------------------------------------
# Upstream Omarchy -- the configuration and theme layer we vendor.
#
# 4.x replaced the shell wholesale: no waybar, walker, mako or swayosd, all one
# quickshell/QML shell. pkgbuilds/omarchy-config/port-4x.patch translates its
# Hyprland coupling to Sway, at build time (P3/P4); it was install/port-4x.sh
# doing it at install time until 2026-09-06. See
# docs/omarchy-4x-feasibility.md. Moved here from install/vendor-omarchy.sh,
# which was the pin's home until the same day (V3).
# ---------------------------------------------------------------------------
[omarchy]
url     = "https://github.com/basecamp/omarchy"
ref     = "c668141e9c42b13c80c9ca4ea108e11708c5e8a5"
version = "v4.0.4"

# ---------------------------------------------------------------------------
# This project's own version. The packages built out of pkgbuilds/ carry it:
# moarchy (bin/, default/, config/) and moarchy-meta (the package set).
# Nothing else in the repo states a version.
# ---------------------------------------------------------------------------
[moarchy]
version = "0.5.0"

# ---------------------------------------------------------------------------
# Our own components. Separate repos, consumed as built packages and never as
# submodules (docs/structure.md B1); this is the pin that buys what a submodule
# would have, without dragging the source tree in.
#
# Neither repo tags releases yet, so these are commit SHAs. When they tag, ref
# becomes the tag and `makepkg` can verify it (P10).
# ---------------------------------------------------------------------------
[moarchy-keyboard]
url        = "https://github.com/SimonSchubert/moarchy-keyboard"
ref        = "1a4585d986b350b3fad533abfb1750f6873681fd"
# The restore handle can be dragged along the right edge -- that repo's SPEC.md
# §4.10, ACs 54-60. It rested bottom right, which is where a chat app puts Send,
# and floating on Overlay (AC 52 below) it covered whatever was there. A drag
# never raises the keyboard, the place survives a restart, and its corners
# follow `corners` in ui.toml the way the shell's Pill, Fab and IconButton do.
# Retracted, the exclusive zone is -1 rather than 0, so the handle sits against
# the output's edge whatever order the surfaces mapped in (AC 4, amended).
#
# And AC 50 as it now stands: text focus does not raise the keyboard. It comes
# up when its restore handle is tapped, when a text field is tapped, or when
# something drives sm.puri.OSK0 -- the back gesture, $mod+i -- and nothing else
# writes the bool, so a dismissal holds until a person ends it. An app asking
# for text input is not an app asking for a keyboard, and reading it as one put
# half the screen under every focused terminal and every tap in the appDrawer's
# search box. It was slow as well as intrusive: each rise and drop re-arranges
# every app on every workspace, and 0.1.0-3 -- what every image from 0.2.1 to
# 0.2.2 carries -- did that on each focus change. Going to this behaviour on the
# Pixel 3a is what made the keyboard feel faster, with no shell change
# (2026-09-16).
#
# AC 53 went with it, because it debounced the down edge of an event that no
# longer exists. --retract-delay is gone with the timer.
#
# And AC 52 before those: the restore handle moves to Overlay while the
# keyboard is retracted, so the appDrawer and Settings stop drawing over the one
# control that brings the keyboard back. That criterion is load-bearing now
# rather than a convenience -- it is the only way up.
#
# This ref is 0.1.0-5. The keyboard's own PKGBUILD moved its pkgrel for it, and
# that is the half this pin cannot do: pinning by commit here can name a fix
# that pacman will never offer, because a phone holding 0.1.0-2 compares
# versions and not contents, and an image hides it completely by installing
# fresh. The trap is permanent, so the warning stays whether or not the bump
# was remembered this time.
#
# What has been run, and where, stated because the repo states it. On the Pixel
# 3a: tests/handle.sh, 14 passed and 0 failed, with one criterion left to an eye
# -- that the frame a margin rides on is always the new state's. AC 50 there was
# judged by hand, and its falsifier in tests/acceptance.sh -- focus a terminal
# and sample Visible six times -- has still not been run on any phone. On the
# PinePhone, nothing: it was not on the network.
version    = "0.1.0"
# The PKGBUILD lives in packaging/, not at the repo root.
pkgbuilddir = "packaging"

# moarchy-store's PKGBUILD builds the package `moarchy-store-git` from
# `source=("...::git+$url.git")` -- a VCS package, which fetches at HEAD when
# makepkg runs. Cloning this repo at the ref below therefore pins what we
# review, but NOT what gets built: makepkg re-clones inside src/.
#
# Pinning it properly means `#commit=` in that PKGBUILD's source array, and
# docs/structure.md B2 says the component repo owns how it is built -- so the
# fix belongs there, not here. Recorded as an open question rather than worked
# around by editing someone else's PKGBUILD from this side.
[moarchy-store]
url     = "https://github.com/SimonSchubert/moarchy-store"
ref     = "7479798928af47cc7fba66ca8d5e79982fd77d78"
pkgname = "moarchy-store-git"
version = "0.1.0"
# Its PKGBUILD is at the repo root, unlike the keyboard's.
pkgbuilddir = "."
#
# Moved off c08a0737 because of what the paragraph above predicted, seen on a
# phone: the package installed there called itself 0.1.0.r58.effa05e and had no
# icon in it. makepkg had re-cloned the code at HEAD, which is where the App
# Store's own artwork has lived since 6f5858d -- but the RECIPE was still
# c08a0737's, and c08a0737's package() does not install it. So the appDrawer drew
# the App Store as a label with an empty square above it, and the version
# string said the fix was already in.
#
# That is the shape of the gap, not a one-off: a version that names one commit
# and a package() from another. This pin now names a PKGBUILD that installs the
# icon; it still does not pin the code, and `#commit=` in that repo's source
# array is still the only thing that would.

# Notes and checklists, kept on the device. A default app rather than something
# to install, because a phone with no way to write a note down is missing
# something a phone is for -- and it is pure Python against the GTK4/libadwaita
# stack the image already carries for Clocks, Text Editor and the rest, so it
# costs the image almost nothing.
#
# The only one of the three pinned twice over, and it is the shape the other
# two should grow into. `ref` pins the packaging, exactly as above -- but its
# PKGBUILD sources a release asset with a sha256sum rather than cloning at
# HEAD, so the pin names the exact code as well. The keyboard's note above and
# the store's below are both about that gap; this one does not have it.
[moarchy-keep]
url     = "https://github.com/SimonSchubert/moarchy-keep"
ref     = "ddc7dcad790e16b32c043a7632a810c6076d70d6"
version = "0.1.0"
pkgbuilddir = "aur/moarchy-keep"

# What the phone is doing: processor, memory, storage, battery, network, and
# what is using them. A default app rather than something to install, for the
# same reason Keep is one -- a phone that cannot answer "what is eating the
# battery" makes you guess, and the answers that exist on Linux are a terminal
# program (btop, which does not fit a phone's terminal at 47 columns, which is
# why `bottom` is in the set beside it) or a desktop window.
#
# It is the shape this file's Keep note asks the other two to grow into, and it
# arrives that way rather than growing into it: `ref` pins the packaging, and
# the PKGBUILD it names sources a release asset with a sha256sum, so the pin
# names the exact code as well. Nothing here clones at HEAD.
#
# The ref is a commit and not the vitals-v0.1.0 tag on purpose. The tag is what
# the tarball is built from, and the PKGBUILD that pins that tarball's checksum
# is necessarily the commit AFTER it -- writing a checksum into a file the tag
# contains would change the bytes the checksum names. So the tag names the code
# and this names the recipe, which is the same split the paragraph above wants.
[moarchy-vitals]
url     = "https://github.com/SimonSchubert/moarchy-apps"
ref     = "5f1257dfc307941673310c824bfd11226df8190f"
version = "0.1.0"
pkgbuilddir = "apps/vitals"

# ---------------------------------------------------------------------------
# Qualcomm's bootctl HAL, ported to Linux. The callback an Android A/B
# bootloader waits for: without it the retry counter in the bootloader control
# block runs down and the slot is marked unbootable, after which the phone
# boots nothing at all until a host runs `fastboot --set-active`. Measured on
# sargo 2026-09-14 (devices.md D26).
#
# A tag rather than a commit -- upstream tags releases and 0.2.2 is the newest.
# The tarball's sha256 lives in the PKGBUILD, so a moved tag stops the build
# rather than changing what a phone runs.
#
# Not device-scoped, though only sargo pulls it in today: nothing in it is
# sargo-specific, and the Fairphone is the same shape (devices.md D0).
# ---------------------------------------------------------------------------
[qbootctl]
url     = "https://github.com/linux-msm/qbootctl"
ref     = "0.2.2"
version = "0.2.2"

# ---------------------------------------------------------------------------
# The Qualcomm modem-side userspace, three upstreams built as one package
# (pkgbuilds/moarchy-qcom-modem). On SDM670 this is what Wi-Fi runs on, which
# is not obvious and is the whole reason these are here -- devices.md D27.
#
# The chain: the WCN3990 Wi-Fi firmware (`wlanmdsp.mbn`) executes on the modem
# DSP, `ath10k_snoc` reaches it over QMI, and nothing in the kernel boots that
# DSP -- `qcom_q6v5_mss.c` sets `rproc->auto_boot = false`. `rmtfs -s` is what
# writes "start" to its remoteproc (rmtfs's own `rproc.c` hunts for the
# `-mss-pil` modalias), so the daemon named after remote *filesystem* service
# is also the ignition. No rmtfs, no modem; no modem, no Wi-Fi.
#
# qrtr is the shared library the other two link, not a daemon we run:
# `net/qrtr/Makefile` is `qrtr-y := af_qrtr.o ns.o`, so the name service is in
# the kernel and `qrtr-ns` must NOT be started beside it. The package builds
# with `-Dqrtr-ns=disabled` for that reason.
#
# linux-msm/pd-mapper is deliberately NOT pinned here. The same argument
# applies to it one step further: CONFIG_QCOM_PD_MAPPER puts the protection
# domain mapper in the kernel, with an `sdm670_domains[]` table that already
# names the WLAN domain. Alpine dropped the userspace daemon for this reason
# and so do we -- the PKGBUILD's header has the detail.
#
# Tags, not commits: all three are tagged and the tarball sha256s live in the
# PKGBUILD, so a moved tag stops the build rather than changing what a phone
# runs. Not device-scoped -- nothing in any of them is sargo-specific.
# ---------------------------------------------------------------------------
[qrtr]
url     = "https://github.com/linux-msm/qrtr"
ref     = "v1.2"
version = "1.2"

[rmtfs]
url     = "https://github.com/linux-msm/rmtfs"
ref     = "v1.3"
version = "1.3"

[tqftpserv]
url     = "https://github.com/linux-msm/tqftpserv"
ref     = "v1.2"
version = "1.2"

# ---------------------------------------------------------------------------
# Megapixels, carried ONLY for a three-line fix to its camera-profile lookup.
#
# The same 2.1.0 tag Arch ships. pkgbuilds/megapixels has the detail; the short
# version is that `find_calibration_by_model` cannot find a profile at all, and
# one of the ways it fails -- colliding with libmegapixels' device config --
# stops the camera starting if you try the obvious workaround.
#
# This pin is meant to be deleted. The patch goes upstream; when it lands, the
# package goes and Arch's is used again. Recorded here rather than in the
# PKGBUILD alone so that "why do we fork this" is answerable from the file that
# lists every version this project chooses.
# ---------------------------------------------------------------------------
[megapixels]
url     = "https://gitlab.com/megapixels-org/Megapixels"
ref     = "2.1.0"
version = "2.1.0"

# ---------------------------------------------------------------------------
# The userspace half of a phone call's audio.
#
# On this SoC a voice call is not carried by the modem alone: the ADSP exposes
# a PCM (VoiceMMode1, card 0 device 4 here) and something has to open it when a
# call starts and close it when the call ends. q6voiced is that something --
# it listens to ModemManager over D-Bus and drives the PCM.
#
# It became REQUIRED the moment audio started working, which is not obvious
# and cost a working feature for an hour. Before Global_cal.acdb the whole q6
# stack was dead, so the modem carried calls entirely on its own: they
# connected and were silent. With q6core probing, q6voice/q6mvm/q6cvs/q6cvp are
# live and the voice path expects a driver -- and with nothing opening
# VoiceMMode1 a dial goes `unknown -> terminated` immediately. Calls got worse
# before they got better, from a change that fixed sound.
# ---------------------------------------------------------------------------
[q6voiced]
url     = "https://gitlab.postmarketos.org/postmarketOS/q6voiced"
ref     = "0.3.1"
version = "0.3.1"

# ---------------------------------------------------------------------------
# Stable MAC addresses for both radios, which on this SoC is not cosmetic for
# Bluetooth -- it is the difference between having Bluetooth and not.
#
# WCN3990 has no BD address of its own that Linux can see: the vendor keeps it
# outside the filesystem and sdm670-google-common.dtsi carries no
# `local-bd-address`. So hci0 probes, downloads qca/crbtfw21.tlv and
# qca/crnv21.bin, reports "QCA setup on UART is completed" -- and bluez lists
# ZERO controllers, because an adapter with no address is "unconfigured" rather
# than broken. `bluetoothctl show` says "No default controller available" and
# nothing anywhere says the word address.
#
# Measured on the handset 2026-09-15: one `btmgmt public-addr` took it from
# "Index list with 0 items" to a powered Primary controller that discovered ten
# devices. This package is that command, made to survive a reboot.
#
# Wi-Fi has the same gap with a milder symptom -- `ath10k_snoc ... invalid MAC
# address; choosing random`, so wlan0 works but is a different device to the
# router on every boot. The same tool fixes both, which is why it is one
# package and one pin.
#
# postmarketOS's, and every Qualcomm device there depends on it through
# soc-qcom. A tag, verified by its sha256 in the PKGBUILD.
# ---------------------------------------------------------------------------
[bootmac]
url     = "https://gitlab.postmarketos.org/postmarketOS/bootmac"
ref     = "v0.7.1"
version = "0.7.1"

# ---------------------------------------------------------------------------
# AUR packages with no aarch64 binary anywhere -- neither in Arch Linux ARM nor
# in Omarchy's own repo, which has no aarch64 tree at all
# (pkgs.omarchy.org/stable/aarch64/omarchy.db -> 404).
#
# This list is what docker/build-packages.sh builds. It used to be built a
# second way -- install/build-src.sh, on the phone -- and adding a package here
# added it to both; the on-device path went with the installer, so the container
# is now the only one. There is still no second list to keep in step.
#
# `version` is what the pinned commit's PKGBUILD produces. It is a record, not
# an input -- nothing reads it, and it is here so that a pin bump shows the
# version change in the diff instead of hiding it.
# ---------------------------------------------------------------------------
[aur.yay]
ref     = "cb43f84828ab4f9700f7c6f9c6d7a923d4cfaff0"
version = "13.0.1-1"

[aur.xdg-terminal-exec]
ref     = "a52e8f23c0be7d482b944c6cf5ddee172da171e4"
version = "0.14.3-1"

[aur.ttf-ia-writer]
ref     = "e9aa94080338d7a7f83a561ce64bf30ab4fb24e4"
version = "20181225-1"

# The Linux Command Library GUI: a Qt6 command reference, and this project's
# own app. A -bin package, but not an x86_64-only one -- its PKGBUILD declares
# arch=('x86_64' 'aarch64') and ships a separate aarch64 tarball with its own
# sha256, so it satisfies P10 the same way any source= entry does.
[aur.lcl-gui-bin]
ref     = "09e7c2d32d9f6e7ff4f00ebfd4cabee8f12392f6"
version = "4.7.1-2"

# cbonsai is what omarchy-launch-screensaver draws. That launcher cannot run
# here -- it opens with `omarchy-cmd-missing ttfx && exit 1` and ttfx has no
# aarch64 build -- so the Settings row was dropped on 2026-09-07 and
# system.screensaver is Unsupported (docs/menu-coverage.md). cbonsai stays
# because it is 15 KB and the launcher starts working the day ttfx exists;
# style.screensaver's branding rows, which only write the text it would draw,
# are still there.
#
# It shipped in packages/ as a prebuilt tarball with no recipe anywhere in the
# repo -- built once by hand and never written down. Listing it here is what
# makes it rebuildable.
[aur.cbonsai]
ref     = "6a643ecb56b91b3ef5f54f4fbfd69c9745b8437c"
version = "1.4.2-1"

# mise, and the reason a coding agent is a tap rather than a research project.
#
# The agent machinery is already on the phone: omarchy-config ships upstream's
# whole bin/ to /usr/bin, so omarchy-agent, omarchy-default-agent and
# omarchy-mise-install are all there, and moarchy.settings already draws
# Apps > AI agent. Every one of those paths runs on mise:
#
#   grok) agent="grok"; agent_package="npm:@xai-official/grok@1.0.25"
#         (pinned: 1.0.30 linux-aarch64 TUI SIGILLs on this SoC, docs/settings.md P13)
#   ...
#   if ! mise use -g "$agent_package"; then
#
# and mise is the single piece Arch Linux ARM does not have. aarch64/extra.db
# carries nodejs 26.8.1 and npm 12.0.2 and no mise at all, which is why this is
# a pin here rather than a name in moarchy-meta alone. Upstream Omarchy
# installs this same AUR package (install/omarchy-base.packages:80).
#
# A -bin package, and legitimately so, the same way lcl-gui-bin is: the PKGBUILD
# declares arch=('x86_64' 'aarch64') and fetches
# mise-v$pkgver-linux-arm64.tar.xz with its own sha256, so it satisfies P10 like
# any other source= entry. Its package() runs the arm64 binary to generate shell
# completions -- fine in a native arm64 builder, which is what [builder] is
# pinned to be, and a reason not to move that pin to an emulated one.
[aur.mise-bin]
ref     = "733c4928246d5930eca189271203330ffd4d955a"
version = "2026.9.1-1"

# Spot: a Spotify client, and the only way either port plays Spotify at all.
#
# The web player cannot. It asks for Widevine, and there is no Widevine for
# aarch64 Linux anywhere: Arch's chromium ships no CDM, every widevine package
# in the AUR is arch=('x86_64') because Google publishes the Linux CDM for
# x86_64 only, and WebKitGTK has no CDM path either. So "Playback disabled" is
# the answer in every browser on an ARM phone, whichever one is installed.
#
# librespot does not use EME -- it speaks Spotify's own protocol, which wants a
# Premium account and no CDM. Spot is the GTK4 and libadwaita client on top of
# it; the AUR packaging declares aarch64 and builds the 0.5.0 release tarball,
# so this ref pins the packaging and the release pins the code. 5.3 MB built,
# 20.7 MB installed, and every runtime dependency is already on both images.
#
# Here so that it is IN THE REPOSITORY rather than baked into an image: the
# store's Install button execs `pacman -S`, which can only reach a package that
# is in a sync database. Verified running and playing on omarchy-mobile's VM on
# 2026-09-13; untested on the PinePhone, where GLES 2.0 may yet have something
# to say about a GTK4 app.
[aur.spot-client]
ref     = "e9edb52471ce5694c419b5d2fee22549135ead5c"
version = "0.5.0-1"

# ---------------------------------------------------------------------------
# Where published packages live, and the key that signs them.
#
# GitHub Releases rather than Pages: pacman fetches from any URL, and a
# release's asset URLs are flat and stable, which is the shape a repo needs.
# Pages would mean committing ~120 MB of binaries to git history per release,
# permanently, for everyone who clones.
#
# The tag is a fixed one, re-uploaded rather than re-created, so the Server URL
# below never changes. Version tags stay for images.
# ---------------------------------------------------------------------------
[repo]
name    = "moarchy"
tag     = "repo"
server  = "https://github.com/SimonSchubert/moarchy/releases/download/repo"
keyid   = "3CA83612E7F3108F442006B418305B893569BAD3"

# ---------------------------------------------------------------------------
# The second repository the phone carries: the apps built in moarchy-apps,
# published as a signed pacman repo on GitHub Pages.
#
# Pages rather than a release tag, which is the opposite of the choice above
# and right for the opposite reason: these are twelve packages of about 100 KB
# each, not 120 MB of system, so the git history they cost is small -- and they
# are rebuilt far more often than the distro is.
#
# THE KEY IS THE SAME ONE. `moarchy package signing`, the fingerprint repeated
# below, signs both repositories -- so moarchy-keyring already ships and trusts
# it, and SigLevel = Required works here with nothing added to the keyring. If a
# third repository ever arrives under a different key, that is the thing that
# changes: pkgbuilds/moarchy-keyring installs exactly one key, read from [repo].
#
# Without this stanza the phone cannot install anything from moarchy-apps at
# all, and that is not a hypothetical: moarchy-store's catalogue lists ten of
# these packages, and its helper installs by execing `pacman -S` against a name
# in a sync database. No stanza, no sync database, no Install button -- on a
# freshly flashed phone, while the developer's own handset worked because
# somebody had added the stanza to it by hand months earlier.
# ---------------------------------------------------------------------------
[repo.apps]
name    = "moarchy-apps"
server  = "https://simonschubert.github.io/moarchy-apps/aarch64"
keyid   = "3CA83612E7F3108F442006B418305B893569BAD3"

# ---------------------------------------------------------------------------
# The container that builds the aarch64 packages. A floating tag is a clone at
# HEAD by another name, so it is pinned by digest; this one is a multi-arch
# index that carries linux/arm64, which is what makes it run natively on Apple
# Silicon rather than under emulation.
#
# Re-resolve a tag to its digest with:
#   TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:menci/archlinuxarm:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
#   curl -sI -H "Authorization: Bearer $TOKEN" \
#     -H "Accept: application/vnd.oci.image.index.v1+json" \
#     https://registry-1.docker.io/v2/menci/archlinuxarm/manifests/base-devel |
#     grep -i docker-content-digest
# ---------------------------------------------------------------------------
[builder]
image  = "menci/archlinuxarm"
tag    = "base-devel"
digest = "sha256:f7c6f64c0f246f41775e01793340c49f8e9abf3991141c25405361d56b100ccb"

# ---------------------------------------------------------------------------
# Google Pixel 3a (sargo), SDM670 -- the second device (docs/devices.md D13).
#
# This section is the whole reason structure.md §2's "not a distribution"
# non-goal had to be amended, and devices.md §2 does that in the open. The
# PinePhone's kernel, u-boot and firmware are DanctNIX's and arrive as pacman
# packages we never build. Nothing equivalent exists for sargo: postmarketOS
# did the SDM670 bring-up and maintains it well, but ships Alpine .apk, so for
# this device moarchy is the packager.
#
# Two upstreams, and they are not the same host. The kernel tree lives on
# gitlab.com and is live -- sdm670-v7.2.3_beta2 was tagged 2026-09-03. pmaports
# does NOT: gitlab.com/postmarketOS/pmaports is an archive whose last activity
# was 2026-03-23, and development moved to gitlab.postmarketos.org. Pinning the
# archive would have frozen us at kernel 6.11.3 while the device we have in
# hand boots 7.0.10, and nothing would have said so.
#
# kernel-ref is a TAG, not a SHA, so makepkg's checksum is what verifies it
# (P10) -- and 7.1.3 is the newest stable tag, matching the config pmaports
# `main` ships for it. The two move together on purpose: a kernel pinned to one
# version with another version's config is a silent olddefconfig away from a
# kernel nobody chose.
#
# Proven, rather than assumed: 7.0.10 from this tree booted on the device on
# 2026-09-13 -- display via msm_dpu, touch, and a debug shell on the panel. If
# 7.1.3 misbehaves, sdm670-v7.0.10 is the tag with evidence behind it.
# ---------------------------------------------------------------------------
[device.sargo]
kernel-url    = "https://gitlab.com/sdm670-mainline/linux"
kernel-ref    = "sdm670-v7.1.3"
# Where the kernel config is vendored FROM, recorded so a config refresh is a
# documented fetch rather than an archaeology exercise. Not fetched at build
# time: the config lives beside the PKGBUILD so a build needs no network to
# know what it is compiling.
config-url    = "https://gitlab.postmarketos.org/postmarketOS/pmaports"
config-ref    = "main"
config-path   = "device/community/linux-postmarketos-qcom-sdm670/config-postmarketos-qcom-sdm670.aarch64"

# The proprietary firmware, from the vendor tree LineageOS maintains. A commit
# and not a branch: these are signed blobs whose contents must not move under a
# phone, and TheMuppets rebases.
#
# pkgbuilds/firmware-moarchy-sargo fetches fourteen individual files from this
# ref rather than the whole tarball, and carries a sha256 for each -- so the
# pin and the checksums have to agree or makepkg stops. Moving this ref means
# regenerating those hashes, which is the intended amount of friction for
# changing what firmware a phone runs.
#
# Same commit postmarketOS's firmware-google-sargo uses, which is where the
# file list came from.
firmware-url  = "https://github.com/TheMuppets/proprietary_vendor_google_sargo"
firmware-ref  = "c631f0f2aa24ea60cfb505d327cd4ae56ca27f16"

# The modem pair, from a THIRD upstream, and the reason it is a third one is
# worth writing down: `mba.mbn` and `modem.mbn` are not in TheMuppets tree at
# all. That tree carries `/vendor/firmware`; the modem images live in sargo's
# own `modem` partition, which an Android vendor dump does not include. This
# repo is where postmarketOS's firmware-google-sargo gets them, pinned at the
# same commit pmaports uses.
#
# 66 MB of it is `modem.mbn`, which reads like a lot of blob for a phone that
# makes no calls -- and calls are not what it is for. The Wi-Fi firmware runs
# on the DSP this boots (devices.md D27), so this pair is the price of Wi-Fi
# and telephony is the thing that comes later, not the other way round.
modem-url     = "https://gitlab.com/flamingradian/firmware-google-sargo-modem"
modem-ref     = "34bbe2c27f35537f13747c9eba67ece6ae141806"

# A FOURTH upstream, for one 23 KB file, and it buys every sound this phone
# makes. `qcom-q6core` loads Global_cal.acdb as firmware and REFUSES TO PROBE
# without it:
#
#   qcom-q6core aprsvc:service:4:3: Direct firmware load for
#       qcom/sdm670/sargo/Global_cal.acdb failed with error -2
#   qcom-q6core ...: probe with driver qcom-q6core failed with error -2
#
# q6afe sits on top of q6core, so the next thing in the log is an AFE timeout
# -- `AFE set params failed -110` -- then the codec failing to enable its MCLK,
# then `deferred probe pending: codec dai not found`, and finally
# /proc/asound/cards reading "--- no soundcards ---". Four errors deep, in a
# cascade whose first line is the only one that names a missing file, and whose
# last three all look like a DSP that is simply not answering.
#
# It is audio CALIBRATION data, which is why it is not in TheMuppets tree: that
# is /vendor/firmware, and this lives in the device's Android config repo.
# LineageOS's, at the commit postmarketOS pins, under a directory named for the
# card this phone actually has -- sdm670-intcodec-s4-snd-card.
acdb-url      = "https://raw.githubusercontent.com/LineageOS/android_device_google_bonito"
acdb-ref      = "a1cd8bf2603569b8b3b450b9d7b5b595eb549df0"
acdb-path     = "acdbdata/OEM/sdm670-intcodec-s4-snd-card/Global_cal.acdb"

# The ALSA use-case profile for that card, from the same org as the kernel.
# Arch's alsa-ucm-conf carries Qualcomm/sdm845 and sc7180 and no sdm670, so
# without this the card exists and PipeWire still shows no sink and no source:
# WirePlumber does not expose a card it has no routing for. It carries a
# VoiceCall verb as well as HiFi, which is what call audio needs.
ucm-url       = "https://gitlab.com/sdm670-mainline/alsa-ucm-conf"
ucm-ref       = "1e39c9fce12cb521bb53a6422532822b2e4faa10"
