    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#codexTile)"/>
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M64 26L96.9 45V83L64 102L31.1 83V45Z"/>
    <path d="M64 26V64M96.9 83L64 64M31.1 83L64 64"/>
