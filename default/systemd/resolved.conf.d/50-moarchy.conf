# moarchy: no name-resolution responders on the network.
#
# systemd-resolved answers LLMNR (5355) and mDNS (5353) queries on every
# interface by default, which announces the phone's hostname to any network it
# joins. Unicast DNS is unaffected. Debug images turn mDNS back on
# (image/configure.sh), because the plugins' install-on-device.sh scripts reach
# the phone as moarchy.local. Takes effect when systemd-resolved next starts.
[Resolve]
LLMNR=no
MulticastDNS=no
