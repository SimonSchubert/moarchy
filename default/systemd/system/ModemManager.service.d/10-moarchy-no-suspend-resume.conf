# ModemManager 1.24.2 (Arch Linux ARM, 2026-10) aborts on every suspend and on
# every stop on Qualcomm IPA modems (FP4, sargo) once mobile data is up:
#
#   mm_iface_modem_count_bearers: assertion failed: (max >= ctx.count)
#
# IPA is multiplex-only, so the bearer list is created with max_active = 0, and
# the cleanup that commit 01208cc6 added to every sleep/shutdown path counts the
# connected (multiplexed) bearer against that 0. Upstream: issue #1013, fixed by
# MR !1401 (0edcb916, "base-manager: fix cleanup of multiplexed bearers"), which
# is not in any 1.24.x release. After the crash the restarted daemon's modem
# setup gets cancelled by the suspend and never retried: no modem, no calls.
#
# --test-no-suspend-resume skips ModemManager's sleep handling entirely. On a
# phone that is what we want anyway: the modem stays registered through suspend
# so calls and texts still arrive. (--test-quick-suspend-resume, which
# postmarketOS ships, does not avoid it: its terse path runs the same count.)
# Drop this once a ModemManager with 0edcb916 is in the repos.
[Service]
ExecStart=
ExecStart=/usr/bin/ModemManager --test-no-suspend-resume
