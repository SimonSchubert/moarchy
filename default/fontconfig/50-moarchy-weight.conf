<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Lift the default weight of the UI font from Regular to SemiBold.

  (Written without the repo's usual double-dash asides on purpose: XML forbids
  them inside a comment, and fontconfig answers a file containing one with
  "not well-formed (invalid token)" and then silently ignores the whole file.)

  Why at all: light text on a dark bar reads thinner than it measures, and this
  panel is 720x1440 at scale 2 held at arm's length. Measured on the device
  against the same string at the same minute, Medium puts 15% more ink down than
  Regular and SemiBold 47%, and 15% was not a change anyone noticed side by
  side. The numbers live in moarchy.bar's textWeight comment.

  Why in fontconfig rather than in QML: the Omarchy shell has 289 Text sites and
  our plugins another 47, none of which inherit a weight from anywhere, and
  neither Style.qml nor Qt gives us one place to set it. Every GTK and Qt app on
  the phone comes along for free, which is the point: the alternative was a
  shell that did not match the apps inside it.

  Why the weight test rather than an unconditional assign: a bare family pattern
  carries NO weight at config-substitution time, because fontconfig fills the
  default in afterwards in FcDefaultSubstitute. So `fc-match "JetBrainsMono Nerd
  Font"` still answers Regular with this file installed, and that is expected
  rather than a bug. Toolkits are not bare: Qt and pango both put an explicit
  weight in the pattern, so they match this rule and get SemiBold. Dropping the
  test to catch the bare case would also rewrite weight=bold and weight=light to
  SemiBold, flattening every deliberate emphasis in the system into one weight.
  Better to lift the default and leave the rest alone.

  The terminal stays Regular, and mostly for free: foot's config names a family
  and a size and no weight at all, so its pattern never matches this rule.
  Measured rather than assumed, by rendering the same foot window with and
  without the explicit opt-out below: identical ink, so the rule was never
  reaching it either way.

  install/config.sh still writes `style=Regular` into foot.ini, which fc-match
  confirms this rule does not touch (`:style=Regular` answers Regular,
  `:weight=regular` answers SemiBold). That is not what saves the terminal
  today; it is there so that the day foot starts putting a weight in its
  pattern, or a fontconfig default changes underneath us, pages of semibold
  `ls` output do not arrive as a surprise. Alacritty already names
  `style = "Regular"` upstream.

  To undo: delete this file from ~/.config/fontconfig/conf.d/ and log out.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>JetBrainsMono Nerd Font</string></test>
    <test name="weight" compare="eq"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>demibold</const></edit>
  </match>
</fontconfig>
