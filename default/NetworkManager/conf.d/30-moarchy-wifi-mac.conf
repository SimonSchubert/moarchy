# One stable MAC address per Wi-Fi network, like current Android and iOS.
#
# The radios on the phones moarchy supports (ath10k on WCN3990) have no MAC
# address Linux can read, so the driver invents a random one on every boot
# ("invalid MAC address; choosing random"). To a router that is a new device
# each boot: a new DHCP lease every time, no reservation possible, and on a
# phone that reboots a lot the router's pool fills with dead leases until it
# refuses the phone an address at all (seen on the FP4, 2026-10-08).
#
# stable-ssid derives the address from the network's SSID and a per-install
# secret (/var/lib/NetworkManager/secret_key): the same network always sees
# the same address, different networks see unrelated ones, and none of them is
# the hardware address. A reflash makes a new secret, so a new address per
# network after a reinstall. Scans still use randomised addresses (NM default).
#
# Per connection, `nmcli connection modify <name> wifi.cloned-mac-address
# random|permanent|<mac>` overrides this.
[connection]
wifi.cloned-mac-address=stable-ssid
