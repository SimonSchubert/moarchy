# Translated from upstream Omarchy default/hypr/looknfeel.conf.
#
# Omarchy values kept verbatim where Sway has an equivalent:
#   gaps_in = 5   -> gaps inner 5
#   gaps_out = 10 -> gaps outer 10
#   border_size = 2 -> default_border pixel 2
#   rounding = 0  -> Sway has no rounding; nothing to do
#
# Dropped with no Sway equivalent: blur, shadows, animations, gradient borders,
# groupbar styling. These are Hyprland renderer features and are precisely what
# a GLES 2.0 device could not have driven anyway.

gaps inner 5
gaps outer 10
default_border pixel 2
default_floating_border pixel 2
smart_borders no_gaps
hide_edge_borders smart

font pango:JetBrainsMono Nerd Font 10

# Omarchy uses dwindle; Sway's default split layout is the closest analogue and
# is what `layout toggle split` cycles.
default_orientation auto

# Colors come from the active theme (see default/themed/sway.conf.tpl).
