# PinePhone (Allwinner A64) hardware profile.
#
# Panel is 720x1440 at 5.95". At scale 1 everything is unreadable and unhittable;
# scale 2 gives a 360x720 logical surface, which is roughly phone-normal.

output * scale 2

# No gaps at all, because the app is what the screen is for.
#
# Omarchy's desktop values (inner 5, outer 10) ate a third of a 360px-wide
# screen. inner 3 was the first cut and still cost every app 6px of width and
# 6px of height: sway applies inner gaps at the workspace edge as well as
# between windows, so a lone window -- which one-app-per-workspace makes the
# normal case -- was inset on all four sides by wallpaper nobody was looking at.
#
# The 2px border stays and costs nothing here. looknfeel.conf's
# `hide_edge_borders smart` drops every border of the only visible window on a
# workspace, so a single app is now flush to its workspace rect; split one and
# the borders come back, which is the only thing left saying which pane has
# focus. See docs/windows.md W1-W3.
gaps inner 0
gaps outer 0
default_border pixel 2

# Touch is the primary input; there is no mouse to show.
seat * hide_cursor 3000

# New windows stack vertically on a tall screen rather than side by side.
default_orientation vertical

# NOTE: the wallpaper is drawn by swaybg (started in autostart.conf) rather than
# by `output background`, so that Omarchy's own background-switching scripts
# keep working unchanged.

# There is deliberately NO fullscreen rule for moa-tui, and the one that used to
# be here -- `for_window [app_id="moa-tui"] fullscreen enable` -- is why the AUR
# install prompt could not be typed into.
#
# The reason it was here was columns: a terminal at font size 9 is ~46 of them
# and btop will not draw below 60. But the width never came from fullscreen. The
# bar anchors top and the keyboard anchors bottom, so both cost rows and neither
# costs a character. What buys the ~60 columns is moarchy-launch-tui's font size
# 7, and it buys them tiled.
#
# What fullscreen did cost was every Top-layer surface. Sway renders a fullscreen
# view above the Top layer and routes touches to it alone -- and moarchy-keyboard
# is on Top on purpose (its src/panel.cpp: on Overlay it maps before the home
# strip and takes the bottom exclusive zone the pill needs). So the keyboard was
# drawn underneath the terminal and its keys took no touches: a prompt on screen
# with no way to answer it. docs/windows.md L2a is the same bug, found first for
# the launch splash and fixed there by moving to Overlay.
#
# Tiled also restores the reservation. The keyboard claims panelHeight + strip
# inset as an exclusive zone when it comes up, so the shell prompt is pushed
# above the keys instead of sitting behind them. A fullscreen window ignores
# exclusive zones, so even a visible keyboard would have covered the prompt.

# The power button.
#
# Two things were fighting over it, and both were wrong for a phone. logind's
# HandlePowerKey defaults to poweroff, and upstream Omarchy binds XF86PowerOff
# to the system menu -- sensible on a desktop, where this button is behind the
# machine and pressed on purpose. Here it is the only button on the device, so a
# press in a pocket shut the phone down.
#
# logind now ignores the short press and keeps the long one (install/session.sh),
# leaving the short press to us.
#
# The unbindsym is load-bearing. Sway compares bindings by key *and flags*, so a
# later `bindsym --locked ... XF86PowerOff` does not replace a bare one -- both
# stay registered and the bare one still wins. Dropping the inherited binding
# explicitly is the only way to take the key over.
#
# --locked so the button still works when a real session lock is up, --no-repeat
# so holding it does not toggle over and over on the way to the long press.
unbindsym XF86PowerOff
bindsym --locked --no-repeat XF86PowerOff exec moarchy-screen toggle
