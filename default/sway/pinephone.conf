# PinePhone (Allwinner A64) hardware profile.
#
# Panel is 720x1440 at 5.95". At scale 1 everything is unreadable and unhittable;
# scale 2 gives a 360x720 logical surface, which is roughly phone-normal.

output * scale 2

# Omarchy's desktop gaps eat a third of a 360px-wide screen.
gaps inner 3
gaps outer 0
default_border pixel 2

# Touch is the primary input; there is no mouse to show.
seat * hide_cursor 3000

# New windows stack vertically on a tall screen rather than side by side.
default_orientation vertical

# NOTE: the wallpaper is drawn by swaybg (started in autostart.conf) rather than
# by `output background`, so that Omarchy's own background-switching scripts
# keep working unchanged.

# TUIs launched via mobileomarchy-launch-tui open fullscreen: a tiled terminal
# on this screen is ~46 columns, below what btop and friends will render in.
for_window [app_id="moa-tui"] fullscreen enable

# The power button.
#
# Two things were fighting over it, and both were wrong for a phone. logind's
# HandlePowerKey defaults to poweroff, and upstream Omarchy binds XF86PowerOff
# to the system menu -- sensible on a desktop, where this button is behind the
# machine and pressed on purpose. Here it is the only button on the device, so a
# press in a pocket shut the phone down.
#
# logind now ignores the short press and keeps the long one (install/session.sh),
# leaving the short press to us.
#
# The unbindsym is load-bearing. Sway compares bindings by key *and flags*, so a
# later `bindsym --locked ... XF86PowerOff` does not replace a bare one -- both
# stay registered and the bare one still wins. Dropping the inherited binding
# explicitly is the only way to take the key over.
#
# --locked so the button still works when a real session lock is up, --no-repeat
# so holding it does not toggle over and over on the way to the long press.
unbindsym XF86PowerOff
bindsym --locked --no-repeat XF86PowerOff exec mobileomarchy-screen toggle
