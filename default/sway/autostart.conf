# Translated from upstream Omarchy default/hypr/autostart.conf.
#
# Dropped: fcitx5 (heavy IME, not wanted on 2-3 GB), omarchy-powerprofiles-init
# (power-profiles-daemon is not installed), omarchy-hyprland-monitor-watch
# (single fixed display).

# Make systemd/D-Bus aware of the session environment (Omarchy's "slow app
# launch fix") -- must run before anything that gets activated over D-Bus.
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP

# 300s was too aggressive in practice -- it locks while you are still reading.
# NOTE: never `pkill swaylock` to clear a lock. Under ext-session-lock the
# compositor stays locked with no client to authenticate against, and sway
# paints a solid red screen. Recover by restarting sway (autologin re-execs it).
exec swayidle -w \
    timeout 600 'mobileomarchy-system-lock' \
    timeout 900 'swaymsg "output * power off"' \
    resume      'swaymsg "output * power on"' \
    before-sleep 'mobileomarchy-system-lock'

exec mako
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec swaybg -i ~/.config/omarchy/current/background -m fill

exec_always mobileomarchy-restart-waybar
