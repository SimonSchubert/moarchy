# Translated from upstream Omarchy default/hypr/autostart.conf.
#
# Dropped: fcitx5 (heavy IME, not wanted on 2-3 GB), omarchy-powerprofiles-init
# (power-profiles-daemon is not installed), omarchy-hyprland-monitor-watch
# (single fixed display), and waybar/mako -- 4.x's quickshell shell provides the
# bar, notifications and OSD itself.

# Make systemd/D-Bus aware of the session environment (Omarchy's "slow app
# launch fix"), then bring the session target up.
#
# Sway is started from ~/.bash_profile rather than uwsm or a display manager, so
# graphical-session.target is never activated on its own -- and every systemd
# user unit Omarchy ships hangs off it. swayosd-server was the visible casualty:
# installed, enabled, and never once started, so every media key talked to a
# D-Bus name that did not exist. sway-session.target is BindsTo that target and
# pulls it up.
#
# These are chained rather than three separate `exec` lines because sway runs
# execs concurrently, and the units must not start before the environment they
# inherit has been imported.
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP && \
     dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP && \
     systemctl --user start sway-session.target

# Blank the screen when idle, but never lock it.
#
# swaylock is an ext-session-lock client, and under that protocol the compositor
# draws the locker's surface and nothing else -- no layer-shell client is shown,
# so the on-screen keyboard cannot appear and there is no way to type a password
# with touch alone. An idle lock therefore left the phone recoverable only over
# ssh. Locking stays available deliberately, on Super+Ctrl+L.
#
# NOTE: never `pkill swaylock` to clear a lock. The compositor stays locked with
# no client to authenticate against, and sway paints a solid red screen. Recover
# by restarting sway (autologin re-execs it).
# resume goes through mobileomarchy-screen rather than straight to swaymsg:
# while the power button has the screen locked, a stray event from the volume
# rocker or the headphone jack must not light the panel back up.
# The timeout goes through mobileomarchy-idle-blank rather than straight to
# swaymsg so it can honour the Stay Awake flag: swayidle fixes its command at
# start and has no conditional, so the condition lives in the command.
exec swayidle -w \
    timeout 600 'mobileomarchy-idle-blank' \
    resume      'mobileomarchy-screen wake'

# 4.x: bar, launcher, notifications and OSD are all this one shell.
exec_always mobileomarchy-restart-shell
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec swaybg -i ~/.local/state/omarchy/current/background -m fill

# On-screen keyboard. It raises itself when a text field takes focus and
# retracts when focus moves to something without one -- no toggle, no gesture.
#
# That works because Sway advertises zwp_input_method_manager_v2 and
# zwp_text_input_manager_v3, so an OSK binding them is handed activate /
# deactivate as apps focus text. (phosh's own stevia does *not* work here: it
# gates surface creation on zphoc_device_state_v1, a phoc-private protocol Sway
# will never have. squeekboard needs no such thing.)
#
# Needs two gsettings, applied by install/config.sh -- without them squeekboard
# starts, binds nothing, and logs only "No system layout present".
exec squeekboard

# Touchscreen gestures are a shell plugin now, not a daemon: see
# default/omarchy/plugins/mobileomarchy.gestures. lisgd could only fire a
# command on release, because it owns no surface and so can draw nothing that
# follows the finger. bin/mobileomarchy-gestures is kept for reference and for
# anyone who wants the old edge-swipe bindings back.

# One app per workspace. Tiling two windows on a 360px screen gives each 180px,
# which nothing here can use, so a new window that would have to share is moved
# to a free workspace and focused. That also makes a workspace equal an app, so
# the sideways swipe above reads as "next app". Kill it for stock tiling.
exec mobileomarchy-one-app-per-workspace

