# Translated from upstream Omarchy default/hypr/bindings/{tiling-v2,utilities,media,clipboard}.conf
#
# Omarchy's key choices are preserved exactly so muscle memory transfers.
# `--to-code` is used for letter bindings so they follow physical position the
# way Hyprland's `code:NN` bindings do.
#
# Where a Hyprland action has no Sway equivalent the line is kept as a comment
# explaining what was dropped, rather than silently disappearing.

set $mod Mod4

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------
bindsym --to-code $mod+Return       exec moarchy-launch-terminal
bindsym --to-code $mod+b            exec moarchy-launch-browser
bindsym --to-code $mod+n            exec omarchy-launch-editor
bindsym --to-code $mod+f            exec moarchy-launch-files

# ---------------------------------------------------------------------------
# Close windows
# ---------------------------------------------------------------------------
bindsym --to-code $mod+w                kill
bindsym --to-code Ctrl+Alt+Delete       exec moarchy-window-close-all

# ---------------------------------------------------------------------------
# Control tiling
# ---------------------------------------------------------------------------
bindsym --to-code $mod+j            layout toggle split
bindsym --to-code $mod+t            floating toggle
bindsym --to-code $mod+Shift+f      fullscreen toggle
bindsym --to-code $mod+Ctrl+f       fullscreen toggle global
bindsym --to-code $mod+o            exec moarchy-window-pop
bindsym --to-code $mod+l            layout toggle split tabbed stacking
# Hyprland `pseudo` ($mod+P) has no Sway equivalent -- dropped.

# ---------------------------------------------------------------------------
# Move focus with SUPER + arrow keys
# ---------------------------------------------------------------------------
bindsym $mod+Left       focus left
bindsym $mod+Right      focus right
bindsym $mod+Up         focus up
bindsym $mod+Down       focus down

# ---------------------------------------------------------------------------
# Swap active window with SUPER + SHIFT + arrow keys
# ---------------------------------------------------------------------------
bindsym $mod+Shift+Left     move left
bindsym $mod+Shift+Right    move right
bindsym $mod+Shift+Up       move up
bindsym $mod+Shift+Down     move down

# ---------------------------------------------------------------------------
# Workspaces (SUPER + [1-9,0]) and moving windows to them (+ SHIFT)
# ---------------------------------------------------------------------------
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# "Silently" (Hyprland movetoworkspacesilent) = move without following.
# Sway's `move container to workspace` already does not follow, so SUPER+SHIFT+ALT
# is bound identically for consistency with Omarchy's muscle memory.
bindsym $mod+Shift+Alt+1 move container to workspace number 1
bindsym $mod+Shift+Alt+2 move container to workspace number 2
bindsym $mod+Shift+Alt+3 move container to workspace number 3
bindsym $mod+Shift+Alt+4 move container to workspace number 4
bindsym $mod+Shift+Alt+5 move container to workspace number 5

# ---------------------------------------------------------------------------
# Scratchpad (Hyprland special workspace -> Sway native scratchpad)
# ---------------------------------------------------------------------------
bindsym --to-code $mod+s        scratchpad show
bindsym --to-code $mod+Alt+s    move scratchpad

# ---------------------------------------------------------------------------
# TAB between workspaces
# ---------------------------------------------------------------------------
bindsym $mod+Tab            workspace next_on_output
bindsym $mod+Shift+Tab      workspace prev_on_output
bindsym $mod+Ctrl+Tab       workspace back_and_forth

# ---------------------------------------------------------------------------
# Cycle through applications on the active workspace
# ---------------------------------------------------------------------------
bindsym Alt+Tab             focus next
bindsym Alt+Shift+Tab       focus prev

# ---------------------------------------------------------------------------
# Resize active window (SUPER + -/=)
# ---------------------------------------------------------------------------
bindsym --to-code $mod+minus            resize shrink width 100px
bindsym --to-code $mod+equal            resize grow width 100px
bindsym --to-code $mod+Shift+minus      resize shrink height 100px
bindsym --to-code $mod+Shift+equal      resize grow height 100px

# ---------------------------------------------------------------------------
# Grouping (Hyprland groups -> Sway tabbed/stacking containers)
# ---------------------------------------------------------------------------
bindsym --to-code $mod+g            layout tabbed
bindsym --to-code $mod+Alt+g        focus parent, layout toggle split
bindsym $mod+Alt+Tab                focus next sibling
bindsym $mod+Alt+Shift+Tab          focus prev sibling
bindsym $mod+Ctrl+Left              focus prev sibling
bindsym $mod+Ctrl+Right             focus next sibling

# ---------------------------------------------------------------------------
# Mouse: drag to move, right-drag to resize; SUPER + scroll cycles workspaces
# ---------------------------------------------------------------------------
floating_modifier $mod normal
bindsym --whole-window $mod+button4     workspace prev_on_output
bindsym --whole-window $mod+button5     workspace next_on_output

# ---------------------------------------------------------------------------
# Menus
# ---------------------------------------------------------------------------
bindsym --to-code $mod+space            exec omarchy-menu toggle
bindsym --to-code $mod+Ctrl+e           exec omarchy-shell shell toggle omarchy.emojis
bindsym --to-code $mod+Ctrl+c           exec omarchy-menu toggle capture
bindsym --to-code $mod+Ctrl+o           exec omarchy-menu toggle toggle
bindsym --to-code $mod+Alt+space        exec omarchy-menu toggle apps
bindsym --to-code $mod+Escape           exec omarchy-menu toggle system
bindsym --to-code $mod+k                exec omarchy-menu-keybindings
bindsym XF86PowerOff                    exec omarchy-menu toggle system

# ---------------------------------------------------------------------------
# Aesthetics
# ---------------------------------------------------------------------------
bindsym --to-code $mod+Shift+space          exec moarchy-toggle-bar
bindsym --to-code $mod+Ctrl+space           exec omarchy-menu toggle background
bindsym --to-code $mod+Shift+Ctrl+space     exec omarchy-menu toggle theme
bindsym --to-code $mod+BackSpace            exec moarchy-window-transparency-toggle
bindsym --to-code $mod+Shift+BackSpace      exec moarchy-window-gaps-toggle

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# 4.x's shell owns notifications (Quickshell.Services.Notifications); there is
# no makoctl to talk to, and dismissal is handled in the shell's own UI.

# ---------------------------------------------------------------------------
# Captures
# ---------------------------------------------------------------------------
bindsym Print                   exec moarchy-capture-screenshot
bindsym $mod+Ctrl+Print         exec moarchy-capture-screenshot region

# ---------------------------------------------------------------------------
# Control panels
#
# 4.x has no omarchy-launch-audio/-bluetooth/-wifi: these are shell panel
# plugins (shell/plugins/panels/*), toggled over the plugin IPC surface. The
# shade carries the same three as tiles; this is the keyboard route to them.
# ---------------------------------------------------------------------------
bindsym --to-code $mod+Ctrl+a       exec omarchy-shell shell toggle omarchy.audio
bindsym --to-code $mod+Ctrl+b       exec omarchy-shell shell toggle omarchy.bluetooth
bindsym --to-code $mod+Ctrl+w       exec omarchy-shell shell toggle omarchy.network
bindsym --to-code $mod+Ctrl+t       exec moarchy-launch-tui btop

# ---------------------------------------------------------------------------
# Touch
# There is no physical keyboard, so the on-screen keyboard raises itself on any
# text field -- this binding is for when a USB keyboard is attached and you
# want the soft one out of the way.
# ---------------------------------------------------------------------------
bindsym --to-code $mod+i            exec moarchy-toggle-keyboard

# ---------------------------------------------------------------------------
# Lock and reload
# ---------------------------------------------------------------------------
bindsym --to-code $mod+Ctrl+l       exec moarchy-system-lock
bindsym --to-code $mod+Shift+r      reload

# ---------------------------------------------------------------------------
# Media / hardware keys
#
# 4.x has no swayosd: the quickshell shell owns the OSD and watches PipeWire via
# Quickshell.Services.Pipewire, so changing volume with wpctl makes the overlay
# appear on its own. Keyboard-backlight and touchpad bindings are dropped -- the
# PinePhone has neither.
# ---------------------------------------------------------------------------
bindsym --locked XF86AudioRaiseVolume   exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume   exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute          exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute       exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86MonBrightnessUp    exec omarchy-brightness-display +5%
bindsym --locked XF86MonBrightnessDown  exec omarchy-brightness-display 5%-
bindsym --locked XF86AudioNext          exec playerctl next
bindsym --locked XF86AudioPrev          exec playerctl previous
bindsym --locked XF86AudioPlay          exec playerctl play-pause
bindsym --locked XF86AudioPause         exec playerctl play-pause

# ---------------------------------------------------------------------------
# Clipboard
# Hyprland's `sendshortcut` (universal copy/paste, SUPER+C / SUPER+V) has no
# Sway equivalent and is dropped. The clipboard *manager* binding is kept.
# ---------------------------------------------------------------------------
bindsym --to-code $mod+Ctrl+v       exec omarchy-shell shell toggle omarchy.clipboard
