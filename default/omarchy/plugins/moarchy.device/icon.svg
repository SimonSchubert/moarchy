      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#devTile)"/>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M32 52h10M32 64h10M32 76h10"/>
    <path d="M86 52h10M86 64h10M86 76h10"/>
    <path d="M52 32v10M64 32v10M76 32v10"/>
    <path d="M52 86v10M64 86v10M76 86v10"/>
  </g>
  <rect x="42" y="42" width="44" height="44" rx="9"
        fill="none" stroke="#ffffff" stroke-width="9"/>
