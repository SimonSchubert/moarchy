<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Shipped rather than named, because a themed name is not a picture.
       `computer-symbolic` is a monochrome glyph the icon theme is free to paint
       near-black, and on a dark sheet the entry was there and invisible. A tile
       with a white glyph reads on any background the theme can produce, and it
       does not depend on the icon theme carrying the name at all, which is not
       a given: the phone shipped on Yaru, which had no wireless icon.
       AppLibrary.iconSource() returns a file URL for any `Icon=` starting with
       "/" and never consults the theme, which is what makes that true.

       No double hyphen anywhere in here. XML forbids one inside a comment, and
       the whole file is then unparseable: rsvg and Qt both refuse it, the
       drawer draws a label with nothing above it, and nothing is logged. This
       file shipped that way for one build because the sentence above it used
       to have an em dash in it.

       This is the last of the three. Wi-Fi and Bluetooth had one each until
       their drawer entries went (docs/apps.md): both are settings screens the
       shade's tiles and Settings already reach, and an app grid is for apps.

       A chip rather than `computer-symbolic`'s desktop tower: the page behind
       it is this phone's CPU, memory, thermals and battery, and nothing on a
       PinePhone looks like a tower. -->
  <defs>
    <linearGradient id="devTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#devTile)"/>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M32 52h10M32 64h10M32 76h10"/>
    <path d="M86 52h10M86 64h10M86 76h10"/>
    <path d="M52 32v10M64 32v10M76 32v10"/>
    <path d="M52 86v10M64 86v10M76 86v10"/>
  </g>
  <rect x="42" y="42" width="44" height="44" rx="9"
        fill="none" stroke="#ffffff" stroke-width="9"/>
  <rect x="56" y="56" width="16" height="16" rx="3" fill="#ffffff"/>
</svg>
