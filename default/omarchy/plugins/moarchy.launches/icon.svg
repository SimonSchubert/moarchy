<?xml version="1.0" encoding="UTF-8"?>
<!-- A rocket, nose up, with the flame under it.

     Drawn as the object rather than as a launch button: the app is a list of
     rockets and the appDrawer is a grid of objects — a handset, a briefcase, a
     book — so a rocket belongs there and a grey square with a rocket in it
     does not. -->
