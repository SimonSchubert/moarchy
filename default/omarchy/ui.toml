# moarchy's UI settings: the shape of things, what each gesture opens, and how
# home is drawn. Independent of the colour theme.
#
# This packaged copy is the documentation and the defaults. The file the shell
# and the apps read is
#
#     ~/.config/omarchy/ui.toml
#
# and every key in it is optional: a missing key, section or file is the value
# written here. A change lands within a second, with no restart.
#
# Edit that file by hand, have an agent edit it, or use the command, which
# changes the one line it was asked about and keeps your comments:
#
#     moarchy-ui set home.opacity 0.7
#     moarchy-ui get gestures.bottom
#     moarchy-ui keys                     every key, its value and its default
#
# Colours are not here. They are the theme's (omarchy-theme-set, colors.toml).
# The coding agent is not here either: it is ~/.config/omarchy/defaults/agent,
# which `moarchy-agent set <name>` and Settings > Apps > AI agent both write.
# Home's pages and tiles are ~/.config/omarchy/home.toml.

[shape]
# How round things are. One word sets every radius below together:
#
#   large    sheets 28, tiles 20, cards 18, home's frames 16   (as shipped)
#   modest   sheets 12, tiles 8,  cards 6,  home's frames 8
#   square   everything 0, which is Omarchy's own look
corners = "large"

# Override one radius of the preset, in logical px. Choosing a preset again
# clears these.
# sheet = 28        the control center and the app drawer
# tile = 20         a tile in a grid: control center tiles, theme cells
# card = 18         a row or a panel: Settings rows, notification cards
# frame = 16        home's tiles, prompt bar and recent strip

[control-center]
# How big the control center's controls are:
#
#   roomy     tiles 62, sliders 48, header buttons 36
#   compact   tiles 48, sliders 36, header buttons 32
density = "roomy"

# Override one size of the preset, in logical px. Choosing a preset again
# clears these.
# tile-height = 62
# slider-height = 48
# button-size = 36

[gestures]
# What a swipe up from the bottom strip, and a swipe in from the right edge,
# raises (docs/gestures.md Q1). A drag up on home follows `bottom`.
#
#   none | app-drawer | app-drawer-minimal | workspace-overview | control-center
#
# `none` takes the sheet off that edge and nothing else: the strip still
# changes workspace and a sweep up still goes home.
bottom = "app-drawer"
right = "workspace-overview"

# What a press and hold on the strip opens, and what two presses of the power
# button inside 400ms open (Q10, Q11). Taps rather than drags, so they also
# take `agent` (the chosen coding agent) or any app's desktop id, which
# `omarchy-shell app-drawer entries` lists.
hold = "agent"
power = "none"

[home]
# Home's grid and the frame its tiles wear (docs/home.md). The pages and what is
# on them are ~/.config/omarchy/home.toml.

# Columns in the grid. Cells are square, so the rows follow from the screen.
columns = 6

# How much a tile's background covers the wallpaper: 0 clear, 1 solid.
opacity = 0.88

# A tile's border, in px. 0 draws none.
border = 2

# Space between two tiles, and from the tiles to the screen's edges, in px.
gaps-in = 6
gaps-out = 6

# Icons in the recent strip above the prompt bar. 0 hides the strip.
recent = 8

# The prompt bar at the bottom of each page of tiles: open an app, or ask the
# coding agent. false hides it; a swipe up still opens the app drawer.
prompt-bar = true
