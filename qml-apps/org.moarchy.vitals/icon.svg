<?xml version="1.0" encoding="UTF-8"?>
<!-- Four bars at four heights, the way the processor page draws its cores.

     Not a gauge and not a chip: the app's own screen is bars, and bars of
     different heights read as activity at 42px where a needle does not. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">

  <rect x="16" y="66" width="20" height="48" rx="8" fill="#3584e4"/>
  <rect x="44" y="34" width="20" height="80" rx="8" fill="#33d17a"/>
  <rect x="72" y="52" width="20" height="62" rx="8" fill="#00b8c4"/>
  <rect x="100" y="22" width="20" height="92" rx="8" fill="#f5c211"/>
  <rect x="16" y="66" width="20" height="14" rx="7" fill="#1c71d8"/>
  <rect x="44" y="34" width="20" height="14" rx="7" fill="#26a269"/>
  <rect x="72" y="52" width="20" height="14" rx="7" fill="#0a8f99"/>
  <rect x="100" y="22" width="20" height="14" rx="7" fill="#e5a50a"/>
</svg>
