<?xml version="1.0" encoding="UTF-8"?>
<!-- A sun with a cloud across it.

     The object rather than a symbol of the app: the drawer is a grid of
     things, and this is the one thing everybody has already agreed means
     weather. The sun sits high and left so that the disc and three rays stay
     clear of the cloud at 42px, which is the size the drawer actually draws.

     No clip path anywhere. QtSvg ignores clip-path and paints a clipPath that
     is declared outside defs, which is how another icon in this repository
     drew as a black square on a phone. The cloud is opaque and simply sits
     over the sun. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">

  <g fill="#f5c211">
    <rect x="45" y="6" width="10" height="18" rx="5"/>
    <rect x="45" y="6" width="10" height="18" rx="5" transform="rotate(45 50 44)"/>
    <rect x="45" y="6" width="10" height="18" rx="5" transform="rotate(90 50 44)"/>
    <rect x="45" y="6" width="10" height="18" rx="5" transform="rotate(135 50 44)"/>
    <rect x="45" y="6" width="10" height="18" rx="5" transform="rotate(180 50 44)"/>
    <rect x="45" y="6" width="10" height="18" rx="5" transform="rotate(225 50 44)"/>
    <rect x="45" y="6" width="10" height="18" rx="5" transform="rotate(270 50 44)"/>
    <rect x="45" y="6" width="10" height="18" rx="5" transform="rotate(315 50 44)"/>
  </g>
  <circle cx="50" cy="44" r="22" fill="#f5c211"/>
  <circle cx="50" cy="44" r="22" fill="#e5a50a" fill-opacity="0.35"/>
  <circle cx="50" cy="40" r="22" fill="#f5c211"/>

  <path d="M40 106a22 22 0 0 1 0-44 22 22 0 0 1 4 0.4 30 30 0 0 1 54 12.6 18 18 0 0 1-8 31z" fill="#deddda"/>
  <path d="M40 100a22 22 0 0 1 0-44 22 22 0 0 1 4 0.4 30 30 0 0 1 54 12.6 18 18 0 0 1-8 31z" fill="#f6f5f4"/>
</svg>
