# Which PCM q6voiced opens and holds for the duration of a call.
#
# Measured on the handset 2026-09-23, after the voice DAIs landed:
#
#   00-00: MultiMedia1  (*) : playback 1
#   00-01: MultiMedia2  (*) : capture 1
#   00-02: CS-VOICE     (*) : playback 1 : capture 1
#   00-03: VoiceMMode1  (*) : playback 1 : capture 1
#
# VoiceMMode1 rather than CS-VOICE: the multimode path is the one that works
# on a VoLTE network as well as a circuit-switched one, and which of those a
# given SIM gets is the operator's business, not the handset's. Both PCMs
# exist, so switching is a one-line change if a network ever needs it.
q6voice_card=0
q6voice_device=3
