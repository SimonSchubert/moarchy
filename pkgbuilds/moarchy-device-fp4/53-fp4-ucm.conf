monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.alsa.use-ucm = true
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = {
      update-props = {
        # S16LE, not 24-bit. The PCM advertises S16_LE and S24_LE, but its
        # S24_LE output does not sit inside the 24-bit range: captured raw
        # with arecord it peaks at 484% of 2**23, where S16_LE from the same
        # device in the same room peaks at 2.2% and clips not at all.
        # Anything downstream that believes the 24-bit framing therefore
        # saturates, and the audible result is a recording made of crackle.
        # Measured 2026-09-23; see docs/fp4-defects.md D16.
        audio.format   = "S16LE"
        audio.rate     = 48000
        audio.channels = 2
        audio.position = "FL,FR"
        api.alsa.period-size = 960
        api.alsa.headroom    = 1024
        api.alsa.disable-batch = true
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = {
      update-props = {
        audio.format   = "S32LE"
        audio.rate     = 48000
        audio.channels = 2
        audio.position = "FL,FR"
        api.alsa.period-size = 960
      }
    }
  }
]
