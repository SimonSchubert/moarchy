# hexagonrpcd serves a file tree to the DSP, and -R says where that tree is.
#
# Upstream's default is /usr/share/qcom/, which is a vendor-wide prefix rather
# than a device one: the sensor configuration this phone needs lives at
# /usr/share/qcom/sm7225/Fairphone/fp4/sensors/, shipped by
# firmware-moarchy-fp4. Started with the default the daemon comes up, attaches
# to the ADSP and then cannot answer anything the sensor core asks for, which
# looks like a working service and produces no sensors.
[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -R /usr/share/qcom/sm7225/Fairphone/fp4 -f /dev/fastrpc-adsp -d adsp -s
