# Disable WiFi power-save on this device. D5: the ath10k_snoc (WCN3990) radio
# defaults to power-save on, which parks the receiver between DTIM beacons and
# adds ~50-80ms of latency to every inbound packet after an idle gap (measured
# ping avg 84ms -> 36ms, min 122ms -> 4ms, with power-save off; 0% loss either
# way). NetworkManager's default is 3 (leave it to the driver = on), so this
# forces 2 (off) for every WiFi connection rather than per-connection.
#
# The cost is idle-power: the radio no longer sleeps between beacons. On a
# handset that is a real tradeoff, but the whole-system idle path here is
# s2idle (D28), which suspends the radio entirely -- so the awake-but-idle
# window this affects is short, and interactive latency is what a phone is
# judged on.
[connection]
wifi.powersave=2
