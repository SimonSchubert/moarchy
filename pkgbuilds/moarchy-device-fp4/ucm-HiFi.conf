# Use case configuration for Fairphone 4
# Author: Luca Weiss <luca.weiss@fairphone.com>

SectionVerb {
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value.TQ "HiFi"
}

# Which amplifier is which, established by ear on the handset 2026-09-23:
#
#   3-0034  DT "left"   TOP of the phone     the earpiece
#   3-0035  DT "right"  BOTTOM of the phone  the loudspeaker
#
# The left/right naming is the vendor's stereo convention -- this handset
# pairs the earpiece with the loudspeaker to make a stereo pair for music,
# which is why both are aw88264 amplifiers and why there is no separate
# earpiece output on the codec. The codec's own EAR/HPH pins are unrouted on
# this board and drive nothing.
#
# So "Speaker" is both amplifiers and "Earpiece" is the left one alone, and
# neither needs anything the other does not already have.

SectionDevice."Speaker" {
	Comment "Loudspeaker and earpiece together, as a stereo pair"

	# Routing only. The volume controls belong to the session manager: they
	# carry a dB scale, so WirePlumber treats them as this route's hardware
	# volume, reads back whatever UCM last wrote and persists it. Winding
	# them to 0 here once taught it the speaker route was silent, and it
	# restored that on every boot afterwards.
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority "100"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece, for calls held to the ear"

	# The left amplifier alone. The right one is silenced rather than left
	# where it was: an earpiece device that also drives the loudspeaker is a
	# call every bystander can hear.
	# Silencing the right amplifier is the whole point of this device, so
	# here the volume control is the only lever there is. It is put back on
	# the way out: a control left at 0 is what the session manager would
	# remember.
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Right Speaker Volume' 0"
	]

	DisableSequence [
		cset "name='Right Speaker Volume' 157"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority "200"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone"

	# The capture path, from the analogue pin inwards:
	#
	#   AMIC1 -> ADC1 (wcd938x)          "ADC1 Switch"
	#         -> SoundWire               "TX SMIC MUXn" = ADC0
	#         -> decimator n             "TX DECn MUX"  = SWR_MIC
	#         -> TX_AIF1_CAP             "TX_AIF1_CAP Mixer DECn"
	#         -> TX_CODEC_DMA_TX_3       "MultiMedia2 Mixer TX_CODEC_DMA_TX_3"
	#
	# Two decimators, both fed from ADC0, on purpose.  The machine driver's
	# be_hw_params_fixup() forces the backend to two channels, so a single
	# decimator leaves the second slot unsourced and the capture times out
	# with EIO ("capture read timeout").  Pointing both at the same ADC
	# satisfies the channel count and puts the one working microphone on
	# both channels, which is also what userspace wants from a mono mic.
	#
	# ADC0 here is the codec's first ADC, i.e. AMIC1.  The enum is the
	# lpass_ver_9 vocabulary (ADC0..ADC3, then SWR_DMIC0..7), not ver_9_2's
	# SWR_MIC0..11 -- worth stating because the two are told apart only by
	# this control's item list.

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='ADC1 Switch' 1"
		# Capture gain, calibrated by ear and against a repeatable stimulus
		# (the haptic motor) on 2026-09-23. ADC1 Volume is the analogue PGA,
		# 0..20 = 0..30 dB, and it goes to maximum because gain ahead of the
		# converter costs less noise than gain after it. TX_DEC is the
		# decimator's digital trim, a 1 dB-per-step scale where 84 is 0 dB;
		# 88 is +4 dB. Together that is +11.5 dB over the first setting that
		# recorded cleanly, measured, which puts speech around a third of
		# full scale with roughly 9 dB of headroom left.
		#
		# Raising TX_DEC beyond 88 buys nothing -- 94 measured +11.2 dB, no
		# better than 88's +11.5 -- so the extra range is not usable here.
		cset "name='ADC1 Volume' 20"
		cset "name='TX_DEC0 Volume' 88"
		cset "name='TX_DEC1 Volume' 88"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
	]

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels "2"
		CapturePriority "100"
	}
}
