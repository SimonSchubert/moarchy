# megapixels device profile for the Fairphone 4.
#
# megapixels matches a profile against /proc/device-tree/compatible, which on
# this phone reads `fairphone,fp4`, and installs profiles as
# /usr/share/megapixels/config/<vendor>,<device>.conf. With no match it prints
#
#   megapixels: No suitable config, defaulting to uvc
#
# and shows nothing, which is what this handset did until now even though the
# kernel side was entirely ready: all three sensors bind, /dev/media0 exposes
# 84 links, every sensor link is ENABLED and IMMUTABLE, and /dev/video0
# advertises UYVY, VYUY, YUYV, YVYU and BA81.
#
# --- how the three sensors map -------------------------------------------
#
#   imx582 1-001a   msm_csiphy0   48 MP, rear
#   imx582 0-001a   msm_csiphy2   48 MP, rear (the second one)
#   imx576 2-0010   msm_csiphy3   25 MP, front
#
# The front camera is the imx576 because that is the 25 MP part in the
# Fairphone 4's specification and the only one of the three that is not an
# imx582. Entity names are given in full -- "imx582 1-001a" and not "imx582"
# -- because there are two of them and a bare driver name is ambiguous here in
# a way it is not on a phone with one sensor per driver.
#
# Which of the two imx582s is main and which is ultra-wide is now established,
# from Fairphone's own board device tree (kernel/msm-extra/devicetree,
# int/15/fp4, qcom/camera/lagoon-camera-sensor-fp4.dtsi):
#
#   cam-sensor@0  "48M imx582 ois"  csiphy-sd-index 2  ->  imx582 0-001a  = MAIN
#   cam-sensor@1  "48M imx582 uw"   csiphy-sd-index 0  ->  imx582 1-001a  = ultra-wide
#
# This profile deliberately uses the ULTRA-WIDE (csiphy0 / imx582 1-001a), not
# the main. The main was tried on the handset 2026-09-24 and the result was
# WORSE, for a concrete reason: mainline qcom-camss exposes NO actuator/lens
# subdev and no V4L2 focus control (checked: media0 lists only the three sensor
# subdevs, no focus control anywhere), so the main's VCM lens sits at its
# unpowered rest position and megapixels cannot step it. The main has a longer
# focal length and shallower depth of field, so at rest focus it came out
# visibly soft. The ultra-wide is fixed-focus with a deep depth of field and is
# sharp with no driving, so it is the better rear camera *until* an actuator
# driver exists. Do not "upgrade" this to the main without also wiring
# autofocus; identity is not the issue, focus is. megapixels' v1 format has
# room for one Rear and one Front, so only one rear sensor is reachable anyway.
#
# --- what is measured and what is guessed ---------------------------------
#
# Measured on the handset: the entity names, the csiphy each sensor feeds, the
# frame sizes (VIDIOC_SUBDEV_ENUM_FRAME_SIZE), the media-bus code
# (0x300f, SRGGB10_1X10) and the link topology the Pipeline stanzas below
# describe.
#
# Guessed: Rate. 30 fps is the usual figure and was not read off the sensor.
#
# Rotate was guessed once and was wrong. Following sargo's convention -- 90
# rear, 270 and mirrored front -- put both cameras 180 degrees out on this
# handset, confirmed by looking at the preview. They are now 270 rear and 90
# front, which is measured rather than inferred. Mirror on the front stays.
Version = 1;
Make: "Fairphone";
Model: "Fairphone 4";

Rear: {
  SensorDriver: "imx582";
  BridgeDriver: "qcom-camss";
  # The dual-tone flash behind the rear lens. Without this megapixels has no
  # LED to reach for and lights the whole screen white instead, which it also
  # does on a PinePhone's front camera for the same reason.
  FlashPath: "/sys/class/leds/white:flash";
  Modes: (
  {
    Width: 4000;
    Height: 2256;
    Rate: 30;
    Format: "RGGB10P";
    Rotate: 270;
    Pipeline: (
      {Type: "Link", From: "msm_csiphy0", FromPad: 1, To: "msm_csid0", ToPad: 0},
      {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
      {Type: "Mode", Entity: "imx582 1-001a"},
      {Type: "Mode", Entity: "msm_csiphy0"},
      {Type: "Mode", Entity: "msm_csid0"},
      {Type: "Mode", Entity: "msm_vfe0_rdi0"}
    );
  }
  );
};

Front: {
  SensorDriver: "imx576";
  BridgeDriver: "qcom-camss";
  # No LED on this side of the phone, so the screen is the flash. Deliberate,
  # and the same thing pine64,pinephone.conf does for its front camera.
  FlashDisplay: true;
  Modes: (
  {
    Width: 2880;
    Height: 2156;
    Rate: 30;
    Format: "RGGB10P";
    Rotate: 90;
    Mirror: True;
    Pipeline: (
      {Type: "Link", From: "msm_csiphy3", FromPad: 1, To: "msm_csid0", ToPad: 0},
      {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
      {Type: "Mode", Entity: "imx576 2-0010"},
      {Type: "Mode", Entity: "msm_csiphy3"},
      {Type: "Mode", Entity: "msm_csid0"},
      {Type: "Mode", Entity: "msm_vfe0_rdi0"}
    );
  }
  );
};
