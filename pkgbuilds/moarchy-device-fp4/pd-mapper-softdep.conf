# Load the remoteproc helpers BEFORE the remoteproc driver (fp4-defects D31).
#
# qcom_q6v5_pas starts the DSPs as soon as it probes. The ADSP firmware then
# asks the protection-domain mapper (QMI "servloc", served by qcom_pd_mapper)
# where its audio PD lives, over the QRTR link that qrtr_smd provides. Nothing
# orders those modules: udev loads them on demand, and on the FP4 they came up
# 40-235 ms AFTER "adsp is now up" on every boot measured (module_load
# tracepoint, 2026-10-09). Usually the ADSP waits long enough; on some boots it
# does not, its audio services never register, and there is no sound card.
#
# A pre: softdep makes modprobe (and udev, which uses libkmod) load them
# first, so the locator is already serving when any DSP boots.
softdep qcom_q6v5_pas pre: qrtr qrtr_smd qcom_pd_mapper
