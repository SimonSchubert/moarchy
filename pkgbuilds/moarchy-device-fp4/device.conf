# Fairphone 4 (fp4, Qualcomm SM7225) facts that nothing can discover at runtime.
#
# Sourced by shell. docs/devices.md D3 is the rule: a key is justified ONLY
# when the value cannot be probed, and each one below carries the sentence
# saying why. Read moarchy-device-sargo/device.conf beside this -- the two are
# deliberately near-identical, and the places they differ are the interesting
# ones.
#
# Notably absent, and for reasons that hold on any phone:
#
#   battery path  -- scan /sys/class/power_supply/*/type for "Battery".
#   output name   -- ask the compositor; it names the panel.
#   output scale  -- hypr-device.lua, beside the rest of the output config.

DEVICE_CODENAME=fp4

# Services this hardware needs and a generic phone does not.
#
# Empty, and -- as on sargo -- that is a statement rather than an omission.
#
# Sensors are no longer in this list, and that is the change rather than the
# omission: `hexagonrpcd` is packaged now (pkgbuilds/hexagonrpc), so the unit
# is enabled by the package itself -- alongside qbootctl's and the usb-debug
# one -- rather than named here for firstboot to start. What this file used to
# say, at length, was that the daemon did not exist and the sensors therefore
# could not work. Measured on an fp4 2026-09-22, they do:
#
#   accelerometer   X=0.74 Y=0.41 Z=9.83 m/s²   (gravity, lying flat)
#   light           23 Lux
#   proximity       FAR
#   gyroscope       X=-0.06 Y=-0.06 Z=0.15
#   magnetometer    X=103.2 Y=-9.2 Z=-4.1 µT
#   compass         3.58°
#
# Three packages, and all three are needed: hexagonrpc bridges FastRPC to the
# ADSP, libssc speaks the sensor core's protocol over it, and iio-sensor-proxy
# publishes the result on D-Bus. They are depends= in the PKGBUILD.
#
# One trap worth recording: hexagonrpcd's own unit serves upstream's default
# root of /usr/share/qcom/, which is a vendor prefix and not a device one. The
# configuration this phone needs is under /usr/share/qcom/sm7225/Fairphone/fp4.
# Started with the default the daemon attaches to the ADSP quite happily and
# then cannot answer anything the sensor core asks it for -- an active service
# and no sensors. The drop-in this package installs sets -R accordingly.
#
# q6voiced IS here as of 2026-09-23, and the reason it was not is worth
# keeping: "there is no call audio path to hold open -- upstream's own UCM
# profile defines a Speaker playback device and nothing else". That was true
# and is no longer. The microphone, the Earpiece device and the capture path
# were built, and then the voice DAIs themselves were ported into the kernel
# from sdm670-mainline, because this SoC's tree had no q6voice/q6cvs/q6mvm/
# q6cvp at all -- no VoiceMMode PCM, nothing for the daemon to open. The card
# now exposes CS-VOICE and VoiceMMode1, so the graph exists and the daemon
# has something to route through.
#
# ModemManager is not here and never will be: every phone moarchy targets has
# a modem, so it is device-independent and lives in moarchy-firstboot.
#
# qbootctl-mark-successful.service is NOT here either, and that is deliberate
# rather than an oversight, exactly as on sargo. This list is enabled by
# moarchy-firstboot, on the first boot, by a script that can fail -- and on an
# A/B device a slot that goes unmarked stops the phone booting entirely a few
# reboots later (D26). The Fairphone has the same A/B bootloader and the same
# retry counter, so the device package ships that unit already enabled and it
# is true before any script runs.
DEVICE_SERVICES="q6voiced.service"

# May this device's partition table be rewritten to grow the rootfs?
#
# `filesystem` -- absolutely not, and the case is even starker than sargo's.
# The rootfs is flashed to `userdata` (/dev/sda11), one partition inside a GPT
# that also holds `super`, `persist`, `metadata` and the rest. sfdisk here
# would rewrite that table on a phone with no removable storage the OS depends
# on and no recovery image of ours, which is the one irreversible thing this
# project could do to a device.
#
# There is nothing to grow but the ext4 inside it anyway -- and userdata on
# this phone is 102.8 GiB, so there is a great deal of it to grow into.
# resize2fs does that on every device moarchy ships.
DEVICE_GROW=filesystem
