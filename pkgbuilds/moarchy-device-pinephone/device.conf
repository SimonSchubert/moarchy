# PinePhone hardware facts that nothing can discover at runtime.
#
# Sourced by shell. Keys only, no logic -- anything that needs a decision
# belongs in the script that reads this, not here.
#
# docs/devices.md D3 is the rule this file lives under: a key is justified ONLY
# when the value cannot be probed. That bar is deliberately high, because a key
# is a cost paid per device forever -- every new phone must supply it, a wrong
# one fails at runtime on hardware you may not own, and nothing checks it. A
# probe is written once and is right on a device nobody has plugged in yet.
#
# So each key below carries the sentence saying why a probe cannot answer it.
# If that sentence cannot be written, the key does not belong here. A list that
# grows past about five is a sign the probes are not being written.
#
# Notably absent, and staying absent:
#
#   battery path  -- scan /sys/class/power_supply/*/type for "Battery". Correct
#                    here (axp20x-battery), correct on a Qualcomm PMIC, correct
#                    on hardware nobody has tried.
#   output name   -- ask sway. `swaymsg -t get_outputs` names the panel; the
#                    shell wants "the one output this phone has", not "DSI-1".
#   output scale  -- lives in sway.conf beside the rest of the output config,
#                    because sway is the only thing that needs telling. Putting
#                    it here as well would give it two homes and one of them
#                    would go stale.

# Which device this is. Nothing probes the SoC to decide -- an image is built
# FOR a device and says so (docs/devices.md §2, non-goals). This is the string
# that says it.
DEVICE_CODENAME=pinephone

# Services this hardware needs and a generic phone does not.
#
# Not probeable by construction: "does this device have a modem that needs its
# own power-management daemon" is knowledge about the board, and the only way to
# discover it at runtime is to try and see, which is what the `|| true` this
# replaced was doing.
#
# eg25-manager owns the Quectel EG25-G's power rails and the GPIO startup
# sequence. DanctNIX's device package enables it already; moarchy-firstboot
# starts it with --now because that script runs DURING the first boot, and a
# plain enable would leave the modem down until the next one.
#
# ModemManager is NOT here. Every phone moarchy targets has a modem of some
# kind, so it is device-independent and stays in moarchy-firstboot.
DEVICE_SERVICES="eg25-manager.service"

# May this device's partition table be rewritten to grow the rootfs?
#
# `partition`, because the PinePhone boots from a card whose size is not known
# until it is in a phone, and the GPT moarchy-grow-rootfs rewrites is the one
# image/boot/sunxi-gpt.sh wrote. Growing it is the whole point of I7.
#
# Not probeable, and that is the §4.1 justification: "is it safe to rewrite
# this table" is a policy about the hardware, not a fact you can read off it.
# The default in moarchy-grow-rootfs is the other value, so forgetting this
# line costs storage rather than a partition table.
DEVICE_GROW=partition
