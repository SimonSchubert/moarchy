# Google Pixel 3a (sargo, Qualcomm SDM670) hardware profile.
#
# Panel is 1080x2220 at 5.6", which is 441 ppi -- two and a half times the
# PinePhone's pixel density in area terms. The scale is the one genuinely
# per-device value in this file, and docs/devices.md D3 explains why it is a
# key rather than a probe: nothing in sysfs knows that 441 ppi wants 3 and
# 271 ppi wants 2, because that is a judgement about thumbs and not a fact
# about hardware.
#
# 3 rather than 2, and the arithmetic is the point:
#
#   PinePhone   720x1440 / 2  =  360x720 logical
#   Pixel 3a   1080x2220 / 3  =  360x740 logical
#
# 360 logical pixels wide on both, to the pixel. Every layout constant in the
# shell -- the bar height, the drawer grid, the keyboard's 200px exclusive
# zone, the home strip -- was tuned against 360 and lands unchanged here. The
# extra 20 rows of height are a taller screen, which is the one thing the QML
# already handles: it reads screen.height with a 720 fallback rather than
# assuming (devices.md §4).
#
# Elements come out ~9% physically smaller than on the PinePhone (147 vs 135
# logical ppi). That is inside the range a thumb does not notice, and the
# alternative -- a fractional scale -- costs sharp text for nothing.
output * scale 3

# --- Everything below is phone-shaped rather than sargo-shaped ---------------
#
# These are the deliberate cost of D2: a device package is the ONLY place
# hardware is named, so there is no shared file for "things true of any phone"
# to hide in. There was a second copy of this block in the PinePhone's profile
# until 2026-09-19; when a second device copies it again, that is the moment to
# reconsider -- not before, because one is not a pattern.

# No gaps at all, because the app is what the screen is for. Omarchy's desktop
# values (inner 5, outer 10) ate a third of a 360px-wide screen; sway applies
# inner gaps at the workspace edge as well as between windows, so even inner 3
# inset a lone window on all four sides with wallpaper nobody was looking at.
gaps inner 0
gaps outer 0

# The 2px border costs nothing: looknfeel.conf's `hide_edge_borders smart`
# drops every border of the only visible window on a workspace, so a single app
# is flush to its workspace rect. Split one and the borders come back, which is
# the only thing left saying which pane has focus. See docs/windows.md W1-W3.
default_border pixel 2

# There is deliberately NO fullscreen rule for moa-tui, and a `for_window
# [app_id="moa-tui"] fullscreen enable` is why the AUR install prompt could not
# be typed into. Kept here because it is the kind of rule that looks obviously
# right and gets added back.
#
# The reason it looked right was columns: a terminal at font size 9 is ~46 of
# them and btop will not draw below 60. But the width never came from
# fullscreen. The bar anchors top and the keyboard anchors bottom, so both cost
# rows and neither costs a character. What buys the ~60 columns is
# moarchy-launch-tui's font size 7, and it buys them tiled.
#
# What fullscreen DID cost was every Top-layer surface. Sway renders a
# fullscreen view above the Top layer and routes touches to it alone -- and
# moarchy-keyboard is on Top on purpose (its src/panel.cpp: on Overlay it maps
# before the home strip and takes the bottom exclusive zone the pill needs). So
# the keyboard was drawn underneath the terminal and its keys took no touches:
# a prompt on screen with no way to answer it. docs/windows.md L2a is the same
# bug, found first for the launch splash and fixed there by moving to Overlay.
#
# Tiled also restores the reservation. The keyboard claims panelHeight + strip
# inset as an exclusive zone when it comes up, so the shell prompt is pushed
# above the keys instead of sitting behind them. A fullscreen window ignores
# exclusive zones, so even a visible keyboard would have covered the prompt.

# Touch is the primary input; there is no mouse to show.
seat * hide_cursor 3000

# New windows stack vertically on a tall screen rather than side by side.
default_orientation vertical

# The power button.
#
# logind's HandlePowerKey defaults to poweroff and upstream Omarchy binds
# XF86PowerOff to the system menu -- both sensible on a desktop, where this
# button is behind the machine and pressed on purpose. Here it is the only
# button on the device and a press in a pocket shut the phone down.
#
# The unbindsym is load-bearing: sway compares bindings by key AND flags, so a
# later `bindsym --locked ...` does not replace a bare one -- both stay
# registered and the bare one still wins. Dropping the inherited binding
# explicitly is the only way to take the key over.
#
# --locked so the button still works when a session lock is up, --no-repeat so
# holding it does not toggle over and over on the way to the long press.
#
# Bound by KEY SYMBOL, not by input device, which is why this survives the move
# between phones unchanged: the PinePhone's AXP803 PEK and sargo's Qualcomm
# pm8998 pwrkey are different drivers emitting the same KEY_POWER.
# Through moarchy-power-press rather than straight to moarchy-screen: a
# second press inside 400ms means the double press instead (gestures.md
# Q11), and a single press still toggles the screen with nothing added to
# it -- no delay, because the wrapper decides after acting rather than
# before.
unbindsym XF86PowerOff
bindsym --locked --no-repeat XF86PowerOff exec moarchy-power-press
