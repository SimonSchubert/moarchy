# The Pixel 3a's speaker loudness stage, run by moarchy-loudness.service.
#
# These numbers are a hardware value in the same sense as q6voiced.conf's PCM
# index: they are tuned to two CS35L36s driving an earpiece and a bottom-firing
# speaker, and they mean nothing on another handset.
#
# Why a compressor at all, when nothing here is short of gain: measured on the
# handset with everything already at its ceiling -- Android's STREAM_MUSIC at
# 15/15, the PipeWire sink at 100%, analog PCM 19/19, digital PCM 816/816 and
# both boost converters on -- music still reached the speaker at -17.0 dBFS RMS
# with peaks at -3.6. That gap IS the loudness that is missing. Compressing it
# and limiting into the last of the headroom took the same track to -10.8 dBFS
# RMS with peaks pinned at -0.5 and no clipped samples (docs/devices.md D34).
#
# Tuned by ear against the measurement, not derived: threshold and makeup were
# raised until it was loud enough and stopped before it pumped. They are live
# adjustable, which is how they were found, and is worth knowing before
# rebuilding a package to try a number:
#
#   pw-cli s <node-id> Props '{ params = [ "comp:Makeup gain (dB)" 15.0 ] }'
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Loudness"
            media.name       = "Loudness"
            filter.graph = {
                nodes = [
                    {   type   = ladspa
                        name   = comp
                        plugin = /usr/lib/ladspa/sc4_1882.so
                        label  = sc4
                        control = {
                            "RMS/peak"             = 0.2
                            "Attack time (ms)"     = 5.0
                            "Release time (ms)"    = 120.0
                            "Threshold level (dB)" = -26.0
                            "Ratio (1:n)"          = 5.0
                            "Knee radius (dB)"     = 3.0
                            "Makeup gain (dB)"     = 15.0
                        }
                    }
                    # The limiter is not decoration: the makeup gain above puts
                    # peaks past full scale by design, and this is what turns
                    # that into level instead of into clipping. Verified by
                    # counting samples at full scale in the sink's monitor --
                    # zero, at -0.5 dB of limit.
                    {   type   = ladspa
                        name   = lim
                        plugin = /usr/lib/ladspa/fast_lookahead_limiter_1913.so
                        label  = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)"  = 6.0
                            "Limit (dB)"       = -0.5
                            "Release time (s)" = 0.2
                        }
                    }
                ]
                links = [
                    { output = "comp:Left output"  input = "lim:Input 1" }
                    { output = "comp:Right output" input = "lim:Input 2" }
                ]
                inputs  = [ "comp:Left input"  "comp:Right input" ]
                outputs = [ "lim:Output 1"     "lim:Output 2"     ]
            }
            capture.props = {
                node.name        = "effect_input.loudness"
                node.description = "Speakers (loudness)"
                media.class      = Audio/Sink
                audio.channels   = 2
                audio.position   = [ FL FR ]
                # Outrank the ALSA sink so a phone with no stored WirePlumber
                # state still elects this as the default. Without it the chain
                # is built, is correct, and has nothing routed through it --
                # which is indistinguishable from not shipping it at all.
                priority.driver  = 2000
                priority.session = 2000
            }
            playback.props = {
                node.name      = "effect_output.loudness"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
