# Google Pixel 3a (sargo) facts that nothing can discover at runtime.
#
# Sourced by shell. docs/devices.md D3 is the rule: a key is justified ONLY
# when the value cannot be probed, and each one below carries the sentence
# saying why. The bar is high on purpose -- a key is a cost paid per device
# forever, and a probe is written once and is right on hardware nobody has
# plugged in yet.
#
# Notably absent, same as the PinePhone's and for the same reasons:
#
#   battery path  -- scan /sys/class/power_supply/*/type for "Battery".
#   output name   -- ask sway; `swaymsg -t get_outputs` names the panel.
#   output scale  -- sway.conf, beside the rest of the output config.

DEVICE_CODENAME=sargo

# Services this hardware needs and a generic phone does not.
#
# Empty, and that is a statement rather than an omission.
#
# The PinePhone lists eg25-manager here because its modem needs a daemon to
# own the power rails. sargo's modem needs q6voiced (voice call routing) and
# hexagonrpcd (the FastRPC bridge the ADSP and the sensors talk over), and
# NEITHER is packaged for Arch -- postmarketOS has them as .apk and nothing
# else does.
#
# Naming them anyway would mean moarchy-firstboot printing
# "!! could not enable/start q6voiced.service" on every first boot, for a
# capability nobody has built. An empty list is the honest answer until those
# packages exist; when they do, they arrive together with this line.
#
# ModemManager is not here and never will be: every phone moarchy targets has
# a modem, so it is device-independent and lives in moarchy-firstboot.
DEVICE_SERVICES=""
